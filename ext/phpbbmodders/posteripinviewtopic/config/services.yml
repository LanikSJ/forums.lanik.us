services:
    phpbbmodders.posteripinviewtopic.listener:
        class: phpbbmodders\posteripinviewtopic\event\main_listener
        arguments:
            - '@auth'
            - '@language'
            - '@template'
            - '@controller.helper'
        tags:
            - { name: event.listener }

    phpbbmodders.posteripinviewtopic.controller.freegeoip:
        class: phpbbmodders\posteripinviewtopic\controller\freegeoip
        arguments:
            - '@auth'
            - '@dbal.conn'
            - '@language'
            - '@request'
            - '%tables%'

    _defaults:
        public: true
