<div id="password-generator">
	<dl>
		<dt>
			<label>{{ lang('PASSWORD_TITLE') ~ lang('COLON') }}</label><br>
			<span>{{ lang('PASSWORD_CREATE_INSTRUCTIONS') }}</span><br>
			<span>{{ lang('PASSWORD_COPY_INSTRUCTIONS') }}</span>
		</dt>
		<dd>
			<input class="inputbox autowidth" id="randomgenerator" type="text" size="25px" rel="pw-generator" data-size="20" data-character-set="a,A,0,#">
			<input class="button2 getNewPass" type="button" value ="{{ lang('PASSWORD_CREATE') }}">
			<input class="button2" type="button" data-copytarget="#randomgenerator" value ="{{ lang('PASSWORD_COPY') }}">
			<span class="password-reminder">{{ lang('PASSWORD_REMINDER_1') }}</span>
		</dd>
	</dl>
</div>
