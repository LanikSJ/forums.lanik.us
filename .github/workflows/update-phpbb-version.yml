name: Update phpBB Version in AGENTS.md

on:
  push:
    branches:
      - main
    paths:
      - "includes/constants.php"
      - ".github/workflows/update-phpbb-version.yml"
  pull_request:
    paths:
      - ".github/workflows/update-phpbb-version.yml"
  schedule:
    # Mondays at 10:00 UTC: catch drift that no push ever triggered
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agents-phpbb-version-${{ github.ref }}
  cancel-in-progress: true

env:
  # markdownlint-cli 0.49.x declares engines.node >= 22, and its ini@7
  # dependency requires ^22.22.2 || ^24.15.0 || >= 26.0.0. Node 26 matches the
  # current organisation standard; do not lower this below 22.
  NODE_VERSION: 26
  MARKDOWNLINT_CLI_VERSION: 0.49.1
  AGENTS_FILE: AGENTS.md
  CONSTANTS_FILE: includes/constants.php
  VERSION_BRANCH: agents-phpbb-version
  VERSION_LABEL: automated pr

jobs:
  sync-phpbb-version:
    name: Sync phpBB version into AGENTS.md
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Read PHPBB_VERSION
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n "s/^@define('PHPBB_VERSION', '\([^']*\)');.*$/\1/p" "$CONSTANTS_FILE" | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::No PHPBB_VERSION definition found in $CONSTANTS_FILE"
            exit 1
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Unexpected PHPBB_VERSION value '${version}' in $CONSTANTS_FILE"
            exit 1
          fi
          echo "Detected PHPBB_VERSION=${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Update AGENTS.md
        env:
          PHPBB_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          marker='- **phpBB Core Version**: `'
          if ! grep -qF -- "$marker" "$AGENTS_FILE"; then
            echo "::error::$AGENTS_FILE is missing the '${marker}' line; add it and re-run"
            exit 1
          fi
          PHPBB_VERSION="$PHPBB_VERSION" perl -pi -e '
            s/^(- \*\*phpBB Core Version\*\*: `)[^`]+(`)$/$1$ENV{PHPBB_VERSION}$2/;
          ' "$AGENTS_FILE"
          if ! grep -qF -- "${marker}${PHPBB_VERSION}\`" "$AGENTS_FILE"; then
            echo "::error::Failed to write phpBB version ${PHPBB_VERSION} into $AGENTS_FILE"
            exit 1
          fi
          echo "$AGENTS_FILE now references phpBB ${PHPBB_VERSION}"

      - name: Lint AGENTS.md
        run: |
          set -euo pipefail
          echo "Linting with markdownlint-cli@${MARKDOWNLINT_CLI_VERSION} on Node $(node --version)"
          npx --yes "markdownlint-cli@${MARKDOWNLINT_CLI_VERSION}" \
            --config .markdownlint.json "$AGENTS_FILE"

      - name: Check for Changes
        id: check
        env:
          PHPBB_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- "$AGENTS_FILE"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "$AGENTS_FILE already references phpBB ${PHPBB_VERSION}"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- "$AGENTS_FILE"
          fi

      - name: Ensure automation label exists
        if: steps.check.outputs.changed == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "$VERSION_LABEL" \
            --color "ededed" \
            --description "Created by project automation" || true

      - name: Create Pull Request
        id: cpr
        if: steps.check.outputs.changed == 'true' && github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: ${{ env.AGENTS_FILE }}
          commit-message: "docs(AGENTS.md): sync phpBB version to ${{ steps.version.outputs.version }}"
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          signoff: false
          branch: ${{ env.VERSION_BRANCH }}
          base: main
          delete-branch: true
          title: "docs(AGENTS.md): sync phpBB version to ${{ steps.version.outputs.version }}"
          body: |
            Sync the **phpBB Core Version** reference in `AGENTS.md` with the `PHPBB_VERSION` value defined in `includes/constants.php`.

            - Detected phpBB version: `${{ steps.version.outputs.version }}`
            - Source of truth: `@define('PHPBB_VERSION', ...)` in `includes/constants.php`
            - Overrides are not permitted; review the diff and merge if the version is expected.
            - Auto-generated by [create-pull-request][1]

            [1]: https://github.com/peter-evans/create-pull-request
          labels: ${{ env.VERSION_LABEL }}
          assignees: LanikSJ
          reviewers: LanikSJ
          draft: false

      - name: Summary
        if: always()
        run: |
          {
            echo "### phpBB version sync"
            echo ""
            echo "- \`PHPBB_VERSION\`: ${{ steps.version.outputs.version }}"
            echo "- \`AGENTS.md\` updated: ${{ steps.check.outputs.changed }}"
            if [ -n "${{ steps.cpr.outputs.pull-request-number }}" ]; then
              echo "- Pull request: #${{ steps.cpr.outputs.pull-request-number }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
